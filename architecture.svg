      <path d="M0 0 10 5 0 10z" fill="#8b5cf6"/>
    </marker>
    <style>
      .box{fill:#161029;stroke:#8b5cf6;stroke-width:1.5}
      .hot{fill:#221034;stroke:#ec4899;stroke-width:1.5}
