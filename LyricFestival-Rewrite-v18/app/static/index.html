<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LyricFestival Rewrite</title>
<style>
:root{--accent:#d7ff57;--bg:#07070a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07070a;color:white;font-family:Inter,Segoe UI,Arial,sans-serif}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:
radial-gradient(circle at 30% 70%,rgba(0,170,255,.18),transparent 35%),
radial-gradient(circle at 72% 32%,rgba(255,20,100,.15),transparent 38%),
linear-gradient(180deg,#0a0a10,#040406)}
#hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:10}
#title{font-weight:800;font-size:16px}#artist{font-size:12px;opacity:.45;margin-top:3px}
.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:10px;padding:7px 10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(0,0,0,.22)}
#lyrics{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px}
#hero{font-size:clamp(64px,12vw,230px);font-weight:900;letter-spacing:-.06em;line-height:.9;text-align:center;position:relative}
#hero .fill{position:absolute;inset:0;color:var(--accent);clip-path:inset(0 var(--remain,100%) 0 0)}
#future{position:absolute;inset:0;pointer-events:none}
.f{position:absolute;left:50%;top:50%;font-weight:800;opacity:.18;transform-style:preserve-3d}
#prev,#next{position:absolute;left:50%;transform:translateX(-50%);width:80vw;text-align:center;opacity:.12;font-size:clamp(18px,2vw,34px);font-weight:700}
#prev{top:13%}#next{bottom:13%}
#status{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.4}

/* =========================================================
   v6 VISUAL RAVE — presentation only. No timing logic here.
   ========================================================= */
:root{
  --fxA:#d7ff57;
  --fxB:#7f5cff;
  --fxGlow:rgba(215,255,87,.45);
}
#stage{isolation:isolate;transition:background 700ms ease}
#semanticLayer,#particleLayer,#beamLayer,#echoLayer{
  position:absolute;inset:0;pointer-events:none;overflow:hidden
}
#beamLayer{z-index:1;mix-blend-mode:screen}
#particleLayer{z-index:3}
#echoLayer{z-index:4}
#semanticLayer{z-index:2}
#lyrics{z-index:5}
#hud,#status{z-index:20}

.fx-beam{
  position:absolute;top:-30%;width:14vw;height:155%;
  opacity:0;filter:blur(8px);transform-origin:50% 0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fxA),transparent 65%),transparent 72%);
}
#beam1{left:12%;transform:rotate(18deg)}
#beam2{right:12%;transform:rotate(-18deg)}
#beam3{left:43%;width:11vw}

.fx-particle{
  position:absolute;left:50%;top:50%;width:7px;height:7px;
  border-radius:999px;background:var(--pc,var(--fxA));
  box-shadow:0 0 16px var(--pc,var(--fxA));
  animation:fxParticle var(--dur,800ms) cubic-bezier(.12,.72,.2,1) forwards
}
@keyframes fxParticle{
  from{opacity:.9;transform:translate(-50%,-50%) scale(1)}
  to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.1)}
}

.fx-symbol{
  position:absolute;left:var(--x);top:-10%;font-size:clamp(22px,3vw,54px);
  font-weight:900;opacity:.55;color:var(--fxA);
  text-shadow:0 0 24px var(--fxGlow);
  animation:fxFall var(--dur,1300ms) linear forwards
}
@keyframes fxFall{to{top:112%;transform:rotate(var(--rot)) translateX(var(--drift));opacity:0}}

.fx-ripple{
  position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;
  border:3px solid var(--fxA);transform:translate(-50%,-50%);
  animation:fxRipple 750ms ease-out forwards
}
@keyframes fxRipple{to{width:65vw;height:65vw;opacity:0;border-width:1px}}

.fx-star{
  position:absolute;width:3px;height:3px;border-radius:50%;background:white;
  box-shadow:0 0 11px white;animation:fxStar 1100ms ease-out forwards
}
@keyframes fxStar{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(2.4)}}

.fx-echo{
  position:absolute;left:50%;top:50%;font-size:clamp(64px,12vw,230px);
  font-weight:900;letter-spacing:-.06em;line-height:.9;white-space:nowrap;
  color:transparent;-webkit-text-stroke:1.5px var(--fxA);opacity:.30;
  animation:fxEcho 650ms cubic-bezier(.18,.8,.2,1) forwards
}
@keyframes fxEcho{
  from{transform:translate(-50%,-50%) scale(.95);opacity:.36}
  to{transform:translate(-50%,-50%) scale(1.65);opacity:0;filter:blur(6px)}
}

#hero{
  transform-style:preserve-3d;
  will-change:transform,filter;
  text-shadow:0 12px 50px rgba(0,0,0,.45);
}
#hero .fill{filter:drop-shadow(0 0 18px var(--fxGlow))}
#hero.fx-default{animation:fxHeroDefault 260ms cubic-bezier(.18,.82,.2,1)}
@keyframes fxHeroDefault{from{opacity:.15;transform:translateZ(-120px) scale(.82)}to{opacity:1;transform:none}}
#hero.fx-fire{animation:fxFire 420ms ease-out;color:#fff2dc;text-shadow:0 0 18px #ffb02e,0 0 58px #ff3b00}
@keyframes fxFire{0%{transform:translateY(.16em) scale(.82) rotateX(18deg);filter:blur(8px)}55%{transform:translateY(-.04em) scale(1.10)}100%{transform:none}}
#hero.fx-ice{animation:fxIce 520ms ease-out;text-shadow:0 0 20px #cbfbff,0 0 65px #31bfff}
@keyframes fxIce{0%{letter-spacing:.08em;filter:blur(15px);transform:scale(1.15)}100%{letter-spacing:-.06em;filter:none}}
#hero.fx-water{animation:fxWater 580ms ease-out}
@keyframes fxWater{0%{transform:rotateZ(-4deg) translateY(.1em) scaleX(1.15)}45%{transform:rotateZ(3deg) translateY(-.05em) scaleX(.96)}100%{transform:none}}
#hero.fx-love{animation:fxLove 520ms ease-out;text-shadow:0 0 38px #ff4d9b}
@keyframes fxLove{0%,100%{transform:scale(1)}30%{transform:scale(1.14)}55%{transform:scale(.98)}78%{transform:scale(1.08)}}
#hero.fx-money{animation:fxMoney 400ms cubic-bezier(.1,.9,.2,1);text-shadow:0 0 45px #8aff5c}
@keyframes fxMoney{from{transform:rotateY(80deg) scale(.7)}to{transform:none}}
#hero.fx-speed{animation:fxSpeed 300ms ease-out}
@keyframes fxSpeed{from{transform:translateX(-25vw) skewX(-18deg);filter:blur(10px)}to{transform:none;filter:none}}
#hero.fx-up{animation:fxUp 430ms ease-out}
@keyframes fxUp{from{transform:translateY(30vh) translateZ(-180px);opacity:.1}to{transform:none;opacity:1}}
#hero.fx-down{animation:fxDown 480ms ease-in}
@keyframes fxDown{0%{transform:translateY(-28vh) rotateX(-25deg)}70%{transform:translateY(.06em) scaleY(.88)}100%{transform:none}}
#hero.fx-impact{animation:fxImpact 260ms cubic-bezier(.08,.9,.2,1);text-shadow:0 0 45px white}
@keyframes fxImpact{from{transform:scale(2.6) translateZ(250px);filter:blur(12px)}to{transform:none;filter:none}}
#hero.fx-glitch{animation:fxGlitch 280ms steps(2,end);text-shadow:7px 0 #ff176d,-7px 0 #00e5ff}
@keyframes fxGlitch{0%{transform:translate(0)}20%{transform:translate(-8px,3px) skewX(8deg)}45%{transform:translate(7px,-2px)}70%{transform:translate(-3px,1px) skewX(-5deg)}100%{transform:none}}
#hero.fx-cosmic{animation:fxCosmic 720ms cubic-bezier(.2,.8,.2,1);text-shadow:0 0 25px #c983ff,0 0 80px #535cff}
@keyframes fxCosmic{from{transform:translateZ(-550px) rotateY(40deg) scale(.3);filter:blur(16px)}to{transform:none;filter:none}}
#hero.fx-rave{animation:fxRave 360ms ease-out;text-shadow:5px 0 #ff1f91,-5px 0 #00f0ff,0 0 45px white}
@keyframes fxRave{0%{transform:scaleY(.3) scaleX(1.6)}55%{transform:scaleY(1.15) scaleX(.92)}100%{transform:none}}
#hero.fx-dark{animation:fxDark 700ms ease-out;text-shadow:0 0 55px #8062ff}
@keyframes fxDark{from{opacity:0;filter:blur(24px);letter-spacing:.18em;transform:scale(.72)}to{opacity:1;filter:none;letter-spacing:-.06em}}
#hero.fx-light{animation:fxLight 420ms ease-out;text-shadow:0 0 22px white,0 0 90px white}
@keyframes fxLight{0%{filter:brightness(3);transform:scale(.7)}100%{filter:none;transform:none}}
#hero.fx-royal{animation:fxRoyal 560ms cubic-bezier(.18,.8,.2,1);text-shadow:0 0 32px #ffd95b}
@keyframes fxRoyal{from{transform:translateY(-16vh) rotateX(35deg) scale(1.4)}to{transform:none}}
#hero.fx-alone{animation:fxAlone 760ms ease-out}
@keyframes fxAlone{0%{transform:scale(1.5);letter-spacing:.1em}100%{transform:scale(.82);letter-spacing:-.06em}}
#hero.fx-stop{animation:fxStop 120ms steps(1,end)}
@keyframes fxStop{from{transform:scale(1.18)}to{transform:none}}
#hero.fx-repeat{animation:fxRepeat 420ms ease-out}
@keyframes fxRepeat{0%{transform:translateX(-.25em)}35%{transform:translateX(.18em)}70%{transform:translateX(-.08em)}100%{transform:none}}


#hero.fx-smoke{animation:fxSmoke 620ms ease-out;text-shadow:0 0 30px #d7d7d7,0 0 80px #8f8f8f}
@keyframes fxSmoke{0%{filter:blur(18px);opacity:.15;transform:scale(.82) translateY(.14em)}55%{filter:blur(5px);opacity:1}100%{filter:none;transform:none}}
#hero.fx-toxic{animation:fxToxic 560ms ease-out;text-shadow:0 0 30px #a8ff3f,0 0 82px #35ff8f}
@keyframes fxToxic{0%{transform:skewX(-18deg) scaleX(1.35);filter:hue-rotate(40deg)}100%{transform:none;filter:none}}
#hero.fx-street{animation:fxStreet 300ms cubic-bezier(.08,.9,.2,1);text-shadow:0 0 22px #ffffff,0 0 55px #4da4ff}
@keyframes fxStreet{0%{transform:translateX(-10vw) rotateY(55deg) scale(.74)}100%{transform:none}}
#hero.fx-luxury{animation:fxLuxury 600ms ease-out;text-shadow:0 0 28px #ffe98c,0 0 90px #ffd24d}
@keyframes fxLuxury{0%{transform:translateY(-12vh) scale(.62) rotateX(35deg)}45%{transform:translateY(.02em) scale(1.08)}100%{transform:none}}
#hero.fx-angel{animation:fxAngel 640ms ease-out;text-shadow:0 0 24px #ffffff,0 0 88px #9df7ff}
@keyframes fxAngel{0%{filter:brightness(2.5) blur(12px);transform:translateY(-18vh) scale(.76)}100%{filter:none;transform:none}}
#hero.fx-devil{animation:fxDevil 440ms ease-out;text-shadow:0 0 22px #ff493f,0 0 66px #a00000}
@keyframes fxDevil{0%{transform:translateY(9vh) scale(1.25) skewX(-8deg)}100%{transform:none}}
#hero.fx-pain{animation:fxPain 720ms ease-out;text-shadow:0 0 24px #98a8ff}
@keyframes fxPain{0%{opacity:.08;filter:blur(12px);transform:scale(1.35)}100%{opacity:1;filter:none;transform:none}}
#hero.fx-rage{animation:fxRage 260ms steps(2,end);text-shadow:10px 0 #ff2a55,-10px 0 #ffd84a,0 0 55px #ff4a4a}
@keyframes fxRage{0%{transform:translate(-8px,2px) scale(1.06)}50%{transform:translate(8px,-2px) scale(.98)}100%{transform:none}}
#hero.fx-body{animation:fxBody 420ms ease-out;text-shadow:0 0 24px #ff6ab4,0 0 60px #ff9b6a}
@keyframes fxBody{0%{transform:scale(1.22) rotateZ(-4deg)}100%{transform:none}}
#hero.fx-weapon{animation:fxWeapon 220ms cubic-bezier(.12,.85,.2,1);text-shadow:0 0 20px #ffffff,0 0 58px #ff2b2b}
@keyframes fxWeapon{0%{transform:translateZ(320px) scale(2.1);filter:blur(10px)}100%{transform:none;filter:none}}
#hero.fx-tech{animation:fxTech 500ms steps(3,end);text-shadow:6px 0 #00f0ff,-6px 0 #9b6cff,0 0 60px #9bf1ff}
@keyframes fxTech{0%{transform:scaleY(.6) scaleX(1.45);filter:hue-rotate(60deg)}100%{transform:none;filter:none}}


.f{
  transition:opacity 300ms ease,filter 300ms ease;
  text-shadow:0 10px 35px rgba(0,0,0,.4);
}
#joinCard{
  position:absolute;left:18px;bottom:18px;z-index:25;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:11px 12px;border:1px solid rgba(255,255,255,.13);
  border-radius:18px;background:rgba(0,0,0,.30);backdrop-filter:blur(16px);
  transition:opacity .25s,transform .25s;
}
#joinCard .joinTitle{font-weight:850;font-size:12px;letter-spacing:-.02em;text-align:center}
#joinCard img{width:108px;height:108px;border-radius:10px;background:#fff;padding:6px}
#joinCard .joinUrl{font-size:9px;opacity:.55;max-width:170px;text-align:center;overflow-wrap:anywhere}
#joinCard.compact{opacity:.18;transform:scale(.78);transform-origin:left bottom}
#joinCard:hover{opacity:1;transform:none}
@media(max-width:700px){
  #joinCard{left:10px;bottom:10px;padding:8px}
  #joinCard img{width:82px;height:82px}
  #joinCard .joinTitle{font-size:10px}
}


#resyncButton{
  position:absolute;right:18px;bottom:18px;z-index:30;
  min-width:132px;height:48px;padding:0 16px;
  border:1px solid rgba(255,255,255,.18);border-radius:999px;
  color:white;background:rgba(7,7,10,.58);backdrop-filter:blur(18px);
  font:800 11px/1 Inter,Segoe UI,sans-serif;letter-spacing:.08em;
  cursor:pointer;box-shadow:0 0 0 rgba(215,255,87,0);
  transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;
}
#resyncButton:hover{transform:scale(1.04);border-color:rgba(215,255,87,.6)}
#resyncButton:active{transform:scale(.96)}
#resyncButton.scanning{
  color:#07070a;background:var(--fxA);border-color:var(--fxA);
  animation:resyncPulse .48s ease-in-out infinite alternate;
  box-shadow:0 0 38px var(--fxGlow)
}
#resyncButton.locked{
  color:#07070a;background:#d7ff57;border-color:#d7ff57;
  animation:resyncLocked .55s cubic-bezier(.1,.9,.2,1)
}
#resyncButton.failed{background:#5b1725;border-color:#ff5577;animation:resyncShake .3s linear}
@keyframes resyncPulse{from{transform:scale(.97);filter:brightness(.85)}to{transform:scale(1.06);filter:brightness(1.25)}}
@keyframes resyncLocked{0%{transform:scale(.7) rotate(-3deg)}55%{transform:scale(1.15) rotate(2deg)}100%{transform:none}}
@keyframes resyncShake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#resyncFlash{
  position:absolute;inset:0;z-index:29;pointer-events:none;opacity:0;
  background:radial-gradient(circle at center,rgba(215,255,87,.35),transparent 42%);
}
#resyncFlash.scanning{animation:scanFlash .55s ease-in-out infinite alternate}
#resyncFlash.locked{animation:lockFlash .65s ease-out}
@keyframes scanFlash{from{opacity:.05;transform:scale(.92)}to{opacity:.32;transform:scale(1.06)}}
@keyframes lockFlash{0%{opacity:.75;filter:brightness(2)}100%{opacity:0;transform:scale(1.25)}}
@media(max-width:700px){
  #resyncButton{right:10px;bottom:10px;min-width:108px;height:44px;padding:0 12px;font-size:9px}
}


#mxmResyncButton{
  position:absolute;right:18px;bottom:74px;z-index:30;
  min-width:154px;height:44px;padding:0 15px;
  border:1px solid rgba(255,255,255,.18);border-radius:999px;
  color:white;background:rgba(7,7,10,.58);backdrop-filter:blur(18px);
  font:800 10px/1 Inter,Segoe UI,sans-serif;letter-spacing:.07em;
  cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s,opacity .2s;
}
#mxmResyncButton:hover{transform:scale(1.04);border-color:rgba(82,218,255,.75)}
#mxmResyncButton:active{transform:scale(.96)}
#mxmResyncButton.disabled{opacity:.28;cursor:not-allowed}
#mxmResyncButton.scanning{
  color:#061019;background:#59ddff;border-color:#59ddff;
  animation:mxmPulse .46s ease-in-out infinite alternate;
  box-shadow:0 0 42px rgba(89,221,255,.55)
}
#mxmResyncButton.locked{
  color:#041014;background:#87f4ff;border-color:#87f4ff;
  animation:resyncLocked .55s cubic-bezier(.1,.9,.2,1)
}
#mxmResyncButton.failed{background:#5b1725;border-color:#ff5577;animation:resyncShake .3s linear}
@keyframes mxmPulse{from{transform:scale(.97);filter:brightness(.85)}to{transform:scale(1.05);filter:brightness(1.25)}}
@media(max-width:700px){
  #mxmResyncButton{right:10px;bottom:62px;min-width:128px;height:40px;padding:0 11px;font-size:8px}
}


/* =========================================================
   v15 BEAT ORACLE + RAVE COMPANION
   ========================================================= */
#beatLayer{
  position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  opacity:.95;
}
#beatHalo{
  position:absolute;left:50%;top:50%;
  width:34vmin;height:34vmin;border-radius:50%;
  transform:translate(-50%,-50%) scale(.75);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    0 0 55px var(--fxGlow),
    inset 0 0 55px color-mix(in srgb,var(--fxA),transparent 75%);
  opacity:.12;
}
#beatGrid{
  position:absolute;inset:-20%;
  background:
    repeating-linear-gradient(90deg,transparent 0 9.9%,rgba(255,255,255,.025) 10%),
    repeating-linear-gradient(0deg,transparent 0 9.9%,rgba(255,255,255,.018) 10%);
  transform:perspective(700px) rotateX(66deg) translateY(38%);
  transform-origin:50% 70%;
  opacity:.18;
}
.beat-ring{
  position:absolute;left:50%;top:50%;width:20vmin;height:20vmin;
  border:2px solid var(--fxA);border-radius:50%;
  transform:translate(-50%,-50%);
  animation:beatRing 660ms cubic-bezier(.08,.72,.18,1) forwards;
  box-shadow:0 0 28px var(--fxGlow);
}
@keyframes beatRing{
  0%{opacity:.8;transform:translate(-50%,-50%) scale(.35)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(4.8)}
}
#stage.beat-hit #beatHalo{animation:beatHaloHit 240ms ease-out}
#stage.downbeat-hit #beatHalo{animation:downbeatHaloHit 420ms cubic-bezier(.08,.9,.2,1)}
@keyframes beatHaloHit{
  0%{opacity:.58;transform:translate(-50%,-50%) scale(.78)}
  100%{opacity:.13;transform:translate(-50%,-50%) scale(1.15)}
}
@keyframes downbeatHaloHit{
  0%{opacity:.9;transform:translate(-50%,-50%) scale(.55);filter:brightness(2)}
  100%{opacity:.14;transform:translate(-50%,-50%) scale(1.38);filter:none}
}
#beatReadout{
  position:absolute;right:18px;top:62px;z-index:21;
  font:800 9px/1.2 Inter,Segoe UI,sans-serif;letter-spacing:.08em;
  opacity:.38;text-align:right;pointer-events:none;
}

/* Companion chrome: only appears away from localhost. */
#companionControls{
  display:none;position:absolute;top:14px;left:50%;transform:translateX(-50%);
  z-index:50;padding:5px;border-radius:999px;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(18px);gap:4px;
}
#companionControls button{
  height:38px;padding:0 17px;border:0;border-radius:999px;
  color:rgba(255,255,255,.6);background:transparent;
  font:850 10px/1 Inter,Segoe UI,sans-serif;letter-spacing:.09em;
}
#companionControls button.active{
  color:#07070a;background:white;
}
#companionRave{
  display:none;position:absolute;inset:0;z-index:5;pointer-events:none;
  align-items:center;justify-content:center;flex-direction:column;
}
#companionOrb{
  width:min(48vw,48vh);height:min(48vw,48vh);border-radius:50%;
  background:
    radial-gradient(circle at 38% 34%,rgba(255,255,255,.26),transparent 9%),
    radial-gradient(circle,var(--fxA),color-mix(in srgb,var(--fxB),transparent 15%) 48%,transparent 70%);
  box-shadow:0 0 80px var(--fxGlow),0 0 180px color-mix(in srgb,var(--fxB),transparent 45%);
  opacity:.72;transform:scale(.72);
  transition:background .4s ease;
}
#companionOrb.hit{animation:orbBeat 300ms cubic-bezier(.08,.9,.2,1)}
#companionOrb.downbeat{animation:orbDownbeat 440ms cubic-bezier(.08,.9,.2,1)}
@keyframes orbBeat{0%{transform:scale(.78)}42%{transform:scale(1.08)}100%{transform:scale(.84)}}
@keyframes orbDownbeat{0%{transform:scale(.65) rotate(-5deg);filter:brightness(2.1)}55%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(.84);filter:none}}
#companionMeta{
  margin-top:24px;text-align:center;font-weight:850;letter-spacing:-.03em;
  text-shadow:0 5px 30px rgba(0,0,0,.55)
}
#companionTrack{font-size:clamp(18px,3.6vw,40px)}
#companionBeatText{font-size:11px;opacity:.46;margin-top:7px;letter-spacing:.12em}

/* Guest/companion transformation. */
body.companion #hud,
body.companion #joinCard,
body.companion #status,
body.companion #resyncButton,
body.companion #mxmResyncButton,
body.companion #beatReadout{
  display:none !important;
}
body.companion #companionControls{display:flex}
body.companion #prev{top:17%;opacity:.16}
body.companion #next{bottom:15%;opacity:.16}
body.companion #hero{font-size:clamp(54px,15vw,220px)}
body.companion.mode-rave #lyrics{opacity:0;pointer-events:none}
body.companion.mode-rave #companionRave{display:flex}
body.companion.mode-karaoke #lyrics{opacity:1}
body.companion.mode-karaoke #companionRave{display:none}

@media(max-width:700px){
  #companionControls{top:10px}
  #companionControls button{height:36px;padding:0 14px;font-size:9px}
}


#privateAudioBar{
  display:none;position:absolute;left:50%;bottom:13px;transform:translateX(-50%);
  z-index:60;gap:7px;align-items:center;padding:6px;
  border:1px solid rgba(255,255,255,.13);border-radius:999px;
  background:rgba(0,0,0,.4);backdrop-filter:blur(18px)
}
#privateAudioButton,#privateAudioMute{
  min-height:42px;border:0;border-radius:999px;padding:0 15px;
  font:850 9px/1 Inter,Segoe UI,sans-serif;letter-spacing:.075em;

function waitIceComplete(pc,timeoutMs=1200){
  if(pc.iceGatheringState==='complete')return Promise.resolve();

async function benchmarkSamsungTV(){
  // Tiny compositor benchmark: only ~450 ms, no huge DOM allocation.
  return await new Promise(resolve=>{
    const probe=document.createElement('div');
    probe.style.cssText='position:absolute;left:-50px;top:-50px;width:20px;height:20px;background:#fff;will-change:transform;pointer-events:none';
    document.body.appendChild(probe);
    let frames=0,start=performance.now(),last=start;
    function tick(now){
      frames++;
      probe.style.transform=`translateX(${frames%20}px)`;
      last=now;
      if(now-start<450){
        requestAnimationFrame(tick);
      }else{
        probe.remove();
        const fps=frames/((last-start)/1000);
        resolve(Math.max(1,Math.min(120,fps)));
      }
    }
    requestAnimationFrame(tick);
  });
}

function lineByTimestamp(p){
  let lo=0,hi=lines.length-1,b=-1;

function preciseAt(p){
  const wm=timingState.wordmap||{};
  const arr=Object.values(wm)
    .map(e=>({
      e,
      s:Number(e.start_ms||0)+Number(timingState.provider_offset_ms||0),
      en:Math.max(
        Number(e.start_ms||0)+Number(timingState.provider_offset_ms||0)+40,
        Number(e.end_ms||0)+Number(timingState.provider_offset_ms||0)
      )
    }))
    .filter(x=>Number.isFinite(x.s))
    .sort((a,b)=>a.s-b.s || Number(a.e.line)-Number(b.e.line) || Number(a.e.word)-Number(b.e.word));

  if(!arr.length)return null;

  let lo=0,hi=arr.length-1,b=-1;
  while(lo<=hi){
    const m=(lo+hi)>>1;
    if(arr[m].s<=p){b=m;lo=m+1}else hi=m-1;
  }

  if(b<0){
    // Authoritative provider: before the first timed word, do not invent one.
    if(timingState.authoritative)return {waiting:true,precise:true};
    return null;
  }

  const cur=arr[b];
  if(p<=cur.en){
    return{
      li:Number(cur.e.line),
      wi:Number(cur.e.word),
      prog:Math.max(0,Math.min(1,(p-cur.s)/(cur.en-cur.s))),
      precise:true
    };
  }

  const nxt=arr[b+1];

  if(timingState.authoritative){
    // MUSIXMATCH RICHSYNC IS LAW.
    // Between provider words, hold the preceding word only until the next
    // provider timestamp. Do not fall back to LRCLIB/Whisper interpolation.
    if(nxt && p<nxt.s){
      return{
        li:Number(cur.e.line),
        wi:Number(cur.e.word),
        prog:1,
        precise:true,
        holding:true
      };
    }
    // After the last provider word, remain on it instead of inventing timings.
    if(!nxt){
      return{
        li:Number(cur.e.line),
        wi:Number(cur.e.word),
        prog:1,
        precise:true,
        holding:true
      };
    }
  }

  if(nxt && Number(nxt.e.line)===Number(cur.e.line) && p<nxt.s && (nxt.s-cur.en)<420){

}

const CATEGORY_DEFS=window.LF_SEMANTIC_CATEGORIES||[];

const SEMANTIC_WORD_INDEX=new Map();
const SEMANTIC_ROOT_RULES=[];
for(const def of CATEGORY_DEFS){
  for(const w of def.words||[]) SEMANTIC_WORD_INDEX.set(cleanSemanticWord(w),def);
  for(const r of def.roots||[]) SEMANTIC_ROOT_RULES.push([cleanSemanticWord(r),def]);
}

function cleanSemanticWord(w){
  return String(w||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/['’]/g,'')
    .replace(/^[^a-z0-9]+|[^a-z0-9]+$/g,'');
}
function cleanSemanticLine(s){
  return (' '+String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]+/g,' ')+' ').replace(/\s+/g,' ');
}
function semanticBase(w){
  let x=cleanSemanticWord(w);
  if(x.length>5 && x.endsWith('ing')) x=x.slice(0,-3);
  if(x.length>4 && x.endsWith('ies')) x=x.slice(0,-3)+'y';
  else if(x.length>4 && x.endsWith('ied')) x=x.slice(0,-3)+'y';
  else if(x.length>4 && x.endsWith('ed')) x=x.slice(0,-2);
  else if(x.length>4 && x.endsWith('es')) x=x.slice(0,-2);
  else if(x.length>3 && x.endsWith('s')) x=x.slice(0,-1);
  if(x.endsWith('in') && x.length>4) x=x+'g'; // trappin -> trapping-ish root
  return x;
}
function semanticFor(word,line){
  const raw=cleanSemanticWord(word);
  const base=semanticBase(raw);
  const ctx=cleanSemanticLine(line);

  // Exact direct hit first.
  const direct=SEMANTIC_WORD_INDEX.get(raw) || SEMANTIC_WORD_INDEX.get(base);
  if(direct) return direct;

  // Phrase / line context next.
  for(const def of CATEGORY_DEFS){
    for(const p of def.phrases||[]){
      const pp=' '+String(p||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]+/g,' ').replace(/\s+/g,' ').trim()+' ';
      if(pp.trim() && ctx.includes(pp)) return def;
    }
  }

  // Root/stem hints for broader coverage.
  for(const [root,def] of SEMANTIC_ROOT_RULES){
    if(!root) continue;
    if(base===root || base.startsWith(root) || (root.length>=4 && base.includes(root))) return def;
  }

  // Soft lexical heuristics for slang / profanity / compact lyric tokens.
  if(/^(mf|mfs|af|wtf|omg|idgaf|idc|frfr|nfs|ngl|irl|tbh)$/.test(base)) return CATEGORY_DEFS.find(d=>d.key==='rage') || {fx:'glitch',a:'#ff4050',b:'#ffd44f'};
  if(/^(shawty|shorty|lil|luh|bae|boo)$/.test(base)) return CATEGORY_DEFS.find(d=>d.key==='love');
  if(/^(gang|ganggang|slatt|slime|twin|homie|brodie|cuh|opp|opps|drillin|trappin)$/.test(base)) return CATEGORY_DEFS.find(d=>d.key==='street');
  if(/^(perk|perky|xanny|wock|wocky|za|zaza|thc)$/.test(base)) return CATEGORY_DEFS.find(d=>d.key==='smoke');
  if(/^(glocky|drakey|drac|ak47|uzii|switch|switchy)$/.test(base)) return CATEGORY_DEFS.find(d=>d.key==='weapon');

  // Deterministic context fallback for truly unknown tokens.
  // This keeps even rare names/words visually alive without any LLM.
  if(/\d/.test(raw)) return {key:'number',fx:'tech',a:'#89f2ff',b:'#9b6cff'};
  if(raw.length>=10) return {key:'longword',fx:'cosmic',a:'#c181ff',b:'#5967ff'};
  if(raw.length<=2) return {key:'shortword',fx:'impact',a:'#ffffff',b:'#d7ff57'};
  if(ctx.includes(' love ')||ctx.includes(' heart ')) return {key:'ctxlove',fx:'love',a:'#ff5da2',b:'#ff9dc9'};
  if(ctx.includes(' money ')||ctx.includes(' cash ')||ctx.includes(' racks ')) return {key:'ctxmoney',fx:'money',a:'#9cff62',b:'#dfff73'};
  if(ctx.includes(' night ')||ctx.includes(' dark ')) return {key:'ctxdark',fx:'dark',a:'#765eff',b:'#120822'};
  if(ctx.includes(' party ')||ctx.includes(' club ')||ctx.includes(' beat ')) return {key:'ctxrave',fx:'rave',a:'#ff27ad',b:'#00f2ff'};
  return {key:'default',fx:'default',a:'#d7ff57',b:'#7f5cff'};
}

    case'speed': burstParticles(12,58);beams(1);break;
    case'up': burstParticles(16,28);break;
    case'down': burstParticles(16,28);break;
    case'weapon': ripple(2);burstParticles(24,46);echo(word,1);break;
    case'impact': ripple(3);burstParticles(28,48);echo(word,2);beams(2);break;
    case'street': beams(1);burstParticles(14,30);break;
    case'smoke': burstParticles(20,20);echo(word,1);break;
    case'toxic': burstParticles(20,34);ripple(2);break;
    case'tech': echo(word,3);beams(1);break;
    case'cosmic': stars(38);ripple(1);break;
    case'rave': beams(2);burstParticles(24,48);ripple(2);break;
    case'dark': stars(12);echo(word,1);break;
    case'light': stars(30);beams(2);ripple(1);break;
    case'angel': stars(24);ripple(1);break;
    case'devil': burstParticles(18,30);echo(word,1);break;
    case'pain': echo(word,2);break;
    case'rage': burstParticles(26,36);echo(word,2);beams(1);break;
    case'body': ripple(2);burstParticles(12,20);break;
    case'royal': symbols('♛',8);burstParticles(15,32);break;
    case'alone': echo(word,1);break;
    case'stop': ripple(1);break;
    case'repeat': echo(word,3);break;
    default: burstParticles(5,16);
  }
}
function futureTransform(word,i){
  const presets=[
    [-42,-24,-350,14,25,-6],[40,-20,-380,9,-28,7],[-48,12,-420,-7,32,5],
    [44,15,-400,-9,-30,-5],[-18,30,-460,-18,12,4],[22,32,-440,-16,-14,-4]
  ];
  const p=presets[i%presets.length];
  return `translate3d(calc(-50% + ${p[0]}vw),calc(-50% + ${p[1]}vh),${p[2]}px) rotateX(${p[3]}deg) rotateY(${p[4]}deg) rotateZ(${p[5]}deg) scale(${.78-i*.075})`;
}
async function loadJoinInfo(){
  try{
    const r=await fetch('/api/join',{cache:'no-store'}),d=await r.json();
    joinUrl.textContent=`${d.mdns_url} · fallback ${d.lan_url}`;
    joinUrl.title=d.lan_url;
  }catch(e){}
}
if(IS_HOST)loadJoinInfo();

function rebuild(t){
  if(!t||!lines[t.li])return;
  const words=lines[t.li].text.match(/\S+/g)||[],w=words[t.wi]||'…';
  lastLine=t.li;lastWord=t.wi;
  prev.textContent=lines[t.li-1]?.text||'';next.textContent=lines[t.li+1]?.text||'';
  hero.innerHTML=`<span>${w}</span><span class="fill">${w}</span>`;heroFill=hero.querySelector('.fill');
  applySemanticVisual(w,lines[t.li].text);if(!IS_HOST){companionNow.textContent=w;updateCompanionTypography();}
  future.innerHTML=words.slice(t.wi+1,t.wi+7).map((x,i)=>`<span class="f" style="transform:${futureTransform(x,i)}">${x}</span>`).join('');
  hero.animate([{opacity:.22,filter:'blur(5px)'},{opacity:1,filter:'none'}],{duration:160,easing:'ease-out'});
}
function reset(){lastLine=-1;lastWord=-1;heroFill=null;hero.className='';hero.textContent='…';future.innerHTML='';prev.textContent='';next.textContent='';particleLayer.innerHTML='';echoLayer.innerHTML='';semanticLayer.innerHTML=''}
function onMedia(m){
  const previousTrackEpoch=media.track_epoch;
  const previousSeekEpoch=media.seek_epoch;
  const tc=m.track_epoch!==previousTrackEpoch;
  const sk=m.seek_epoch!==previousSeekEpoch;

  const before=pos();
  let incoming=Number(m.position_ms||0);

  // Same track + no real seek => network/event arrival may NEVER rewind the
  // browser's local playback clock.
  if(!tc && !sk && m.playing){
    incoming=Math.max(incoming,before);
  }

  media={...m,position_ms:incoming,local_anchor_ms:performance.now()};

  title.textContent=m.title||'Waiting for Spotify…';
  artist.textContent=m.artist||'';
  transport.textContent=`${m.clock_mode||m.event||'tick'} · ${m.playing?'PLAY':'PAUSE'} · rawΔ${m.raw_delta_ms||0}`;
  epoch.textContent=`T${m.track_epoch} S${m.seek_epoch} P${m.playback_epoch}`;

  if(tc){reset();lines=[]}
  if(sk){lastLine=-1;lastWord=-1}
}
function updateResyncButtons(){
  const auth=!!timingState.authoritative;
  mxmResyncButton.classList.toggle('disabled',!auth);
  mxmResyncButton.disabled=!auth;
  resyncButton.classList.toggle('disabled',auth);
  resyncButton.disabled=auth;
}
function onLyrics(d){
  lines=d.lyrics?.lines||[];
  timingState=d.timing||{};
  updateResyncButtons();
  lyricsBadge.textContent=d.lyrics?.ok
    ? (timingState.authoritative
        ? `${(d.lyrics.provider||'LYRICS').toUpperCase()} AUTHORITATIVE`
        : `${(d.lyrics.provider||'LYRICS').toUpperCase()} ${(timingState.quality||d.lyrics.quality||'').toUpperCase()}`)
    : 'NO LYRICS';
  reset()
}

let resyncBusy=false;
function resyncVisualState(kind,label){
  resyncButton.classList.remove('scanning','locked','failed');
  resyncFlash.classList.remove('scanning','locked');
  if(kind)resyncButton.classList.add(kind);
  if(kind==='scanning'||kind==='locked')resyncFlash.classList.add(kind);
  resyncButton.textContent=label;
}

let mxmResyncBusy=false;
function mxmVisualState(kind,label){
  mxmResyncButton.classList.remove('scanning','locked','failed');
  if(kind)mxmResyncButton.classList.add(kind);
  mxmResyncButton.textContent=label;
}
async function forceMusixmatchResync(){
  if(mxmResyncBusy || !timingState.authoritative)return;
  mxmResyncBusy=true;
  mxmVisualState('scanning','🎯 CALIBRATING…');
  burstParticles(24,42);beams(2);ripple(2);

  try{
    const r=await fetch('/api/musixmatch-resync',{method:'POST',cache:'no-store'});
    const d=await r.json();

    if(d.ok){
      mxmVisualState(
        'locked',
        `✓ MXM ${Number(d.provider_offset_ms||0)>=0?'+':''}${Math.round(Number(d.provider_offset_ms||0))}ms`
      );
      burstParticles(34,54);beams(3);ripple(4);
      setTimeout(()=>mxmVisualState('','🎯 SYNC MUSIXMATCH'),1900);
    }else{
      mxmVisualState('failed','✕ MXM SYNC FAILED');
      setTimeout(()=>mxmVisualState('','🎯 SYNC MUSIXMATCH'),1700);
    }
  }catch(e){
    mxmVisualState('failed','✕ MXM SYNC FAILED');
    setTimeout(()=>mxmVisualState('','🎯 SYNC MUSIXMATCH'),1700);
  }finally{
    setTimeout(()=>{mxmResyncBusy=false},450);
  }
}
mxmResyncButton.addEventListener('click',forceMusixmatchResync);

async function forceResync(){
  if(resyncBusy)return;
  resyncBusy=true;
  resyncVisualState('scanning','⚡ SCANNING VOCALS…');
  burstParticles(26,52);beams(2);ripple(3);
  try{
    const r=await fetch('/api/resync',{method:'POST',cache:'no-store'});
    const d=await r.json();
    if(d.ok){
      if(d.authoritative){
        resyncVisualState('locked','✓ PROVIDER LOCKED');
      }else{
        resyncVisualState('locked',`✓ LOCKED · ${d.matches||0} MATCHES`);
        burstParticles(42,64);beams(3);ripple(4);
      }
      setTimeout(()=>resyncVisualState('', '⚡ FORCE RESYNC'),1700);
    }else{
      resyncVisualState('failed','✕ RESYNC FAILED');
      setTimeout(()=>resyncVisualState('', '⚡ FORCE RESYNC'),1700);
    }
  }catch(e){
    resyncVisualState('failed','✕ RESYNC FAILED');
    setTimeout(()=>resyncVisualState('', '⚡ FORCE RESYNC'),1700);
  }finally{
    setTimeout(()=>{resyncBusy=false},450);
  }
}
resyncButton.addEventListener('click',forceResync);

function connect(){
  const ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onopen=()=>status.textContent='oracle websocket live';
  ws.onclose=()=>{status.textContent='reconnecting…';setTimeout(connect,400)};
  ws.onerror=()=>ws.close();
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==='snapshot'){onMedia(d.media||{});onLyrics({lyrics:d.lyrics||{},timing:d.timing||{}});onBeatState(d.beat||{})}
    else if(d.type==='media')onMedia(d.media||{});
    else if(d.type==='beat')onBeat(d.beat||{});
    else if(d.type==='beat_state')onBeatState(d.beat||{});
    else if(d.type==='lyrics_reset'){reset();lines=[];lyricsBadge.textContent='LOADING'}
    else if(d.type==='lyrics')onLyrics(d);
    else if(d.type==='timing'||d.type==='timing_reset'){timingState=d.timing||{};updateResyncButtons();if(d.type==='timing_reset'){lastLine=-1;lastWord=-1}}
    else if(d.type==='mxm_resync'){
      if(d.phase==='scanning' && !mxmResyncBusy)mxmVisualState('scanning','🎯 REMOTE MXM SYNC…');
      else if(d.phase==='locked' && !mxmResyncBusy){
        const off=Number(d.result?.provider_offset_ms||0);
        mxmVisualState('locked',`✓ MXM ${off>=0?'+':''}${Math.round(off)}ms`);
        setTimeout(()=>mxmVisualState('','🎯 SYNC MUSIXMATCH'),1500);
      }else if(d.phase==='failed' && !mxmResyncBusy){
        mxmVisualState('failed','✕ MXM SYNC FAILED');
        setTimeout(()=>mxmVisualState('','🎯 SYNC MUSIXMATCH'),1500);
      }
    }
    else if(d.type==='resync'){
      if(d.phase==='scanning' && !resyncBusy)resyncVisualState('scanning','⚡ REMOTE RESYNC…');
      else if(d.phase==='locked' && !resyncBusy){resyncVisualState('locked','✓ TIMING LOCKED');setTimeout(()=>resyncVisualState('','⚡ FORCE RESYNC'),1400)}
      else if(d.phase==='failed' && !resyncBusy){resyncVisualState('failed','✕ RESYNC FAILED');setTimeout(()=>resyncVisualState('','⚡ FORCE RESYNC'),1400)}
    }
  }
}
function frame(){
  if(lines.length){
    const p=pos(),t=currentTiming(p);
    if(t && !t.waiting){
      if(t.li!==lastLine||t.wi!==lastWord)rebuild(t);
      if(heroFill)heroFill.style.clipPath=`inset(0 ${(1-t.prog)*100}% 0 0)`;
      const q=Math.floor(p);
      status.textContent=`${Math.floor(q/60000)}:${String(Math.floor(q/1000)%60).padStart(2,'0')}.${String(q%1000).padStart(3,'0')} · ${timingState.authoritative?'PROVIDER CLOCK · MXMΔ'+(timingState.provider_offset_ms||0)+'ms':(timingState.status||'timing')} · ${media.clock_mode||'oracle'}${timingState.authoritative?'':' · Δ'+(timingState.offset_ms||0)+'ms'}`;
    }
  }
  requestAnimationFrame(frame);
}
connect();requestAnimationFrame(frame)
})();
